<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#45758d"/></marker></defs><rect width="900" height="1110" fill="#edf3f5"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#17394c">Windsor OSM · Local update workflow</text><text x="40" y="78" font-family="Arial,sans-serif" font-size="15" fill="#516f7c">Candidates are reviewed before they become OSM modifications.</text><g fill="none" stroke="#45758d" stroke-width="2.5" marker-end="url(#arrow)"><path d="M220 210 V240 H450 V265"/><path d="M680 210 V240 H450"/><path d="M450 370 V425"/><path d="M450 530 V585"/><path d="M450 700 V755"/><path d="M450 860 V915"/></g><rect x="40" y="110" width="360" height="100" rx="12" fill="white" stroke="#9ab5c2"/><text x="58" y="139" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#183f54">1A · Municipal sources</text><text x="58" y="166" font-family="Arial,sans-serif" font-size="13" fill="#456271">12 GIS layers + checked PXO list</text><text x="58" y="189" font-family="Arial,sans-serif" font-size="13" fill="#456271">City dates, IDs, geometry, licence</text><rect x="500" y="110" width="360" height="100" rx="12" fill="white" stroke="#9ab5c2"/><text x="518" y="139" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#183f54">1B · OSM snapshot</text><text x="518" y="166" font-family="Arial,sans-serif" font-size="13" fill="#456271">Crossings, roads, three facility types</text><text x="518" y="189" font-family="Arial,sans-serif" font-size="13" fill="#456271">Object IDs, versions, tags, geometry</text><rect x="190" y="270" width="520" height="100" rx="12" fill="white" stroke="#9ab5c2"/><text x="208" y="299" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#183f54">2 · Validate and preserve inputs</text><text x="208" y="326" font-family="Arial,sans-serif" font-size="13" fill="#456271">Counts / IDs / timestamps / city boundary</text><text x="208" y="349" font-family="Arial,sans-serif" font-size="13" fill="#456271">raw/ + run-manifest.json</text><rect x="190" y="430" width="520" height="100" rx="12" fill="white" stroke="#9ab5c2"/><text x="208" y="459" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#183f54">3 · Compare and classify</text><text x="208" y="486" font-family="Arial,sans-serif" font-size="13" fill="#456271">Tag consistency, shared nodes, proximity, speed</text><text x="208" y="509" font-family="Arial,sans-serif" font-size="13" fill="#456271">windsor-review.geojson + CSV + summary.json</text><rect x="190" y="590" width="520" height="110" rx="12" fill="white" stroke="#9ab5c2"/><text x="208" y="619" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#183f54">4 · Verify each physical feature</text><text x="208" y="646" font-family="Arial,sans-serif" font-size="13" fill="#456271">Survey / permitted imagery / dated operator records</text><text x="208" y="669" font-family="Arial,sans-serif" font-size="13" fill="#456271">Exact arm, date, field value, permission → evidence register</text><rect x="190" y="760" width="520" height="100" rx="12" fill="white" stroke="#9ab5c2"/><text x="208" y="789" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#183f54">5 · Decide and prepare reviewed edits</text><text x="208" y="816" font-family="Arial,sans-serif" font-size="13" fill="#456271">Unresolved → keep pending; confirmed → prepare changes</text><text x="208" y="839" font-family="Arial,sans-serif" font-size="13" fill="#456271">Current OSM check → reviewed .osm / .osc + export audit</text><rect x="190" y="920" width="520" height="100" rx="12" fill="white" stroke="#9ab5c2"/><text x="208" y="949" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#183f54">6 · JOSM review and actual upload</text><text x="208" y="976" font-family="Arial,sans-serif" font-size="13" fill="#456271">Current surroundings → topology → Validator → upload</text><text x="208" y="999" font-family="Arial,sans-serif" font-size="13" fill="#456271">Record confirmed changeset URL; feed next comparison</text><path d="M710 810 H815 V645 H715" fill="none" stroke="#bb8426" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="823" y="710" font-family="Arial,sans-serif" font-size="12" fill="#9a6a1d" transform="rotate(90 823 710)">More evidence needed</text><text x="40" y="1063" font-family="Arial,sans-serif" font-size="14" fill="#516f7c">New runs preserve old results. No API writes occur in the download/compare steps.</text><text x="40" y="1086" font-family="Arial,sans-serif" font-size="12" fill="#516f7c">Comparison output: windsor-review.geojson · Edit output: windsor-reviewed-changes.osm</text></svg>